<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FD Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f1f5f9;color:#0f172a;padding:12px}
.box{max-width:960px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.top{background:#ea580c;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;transition:.3s}
.top h1{font-size:19px}
.top p{font-size:12px;opacity:.9;margin-top:2px}
.cur{background:rgba(0,0,0,.2);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:bold;color:#fff}
.cur select{background:#fff;color:#0f172a;border:none;padding:4px 8px;border-radius:6px;font-weight:bold;margin-left:6px;cursor:pointer}
.body{padding:18px 20px}
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin-bottom:20px}
@media(max-width:750px){.grid{grid-template-columns:1fr}}
.panel{background:#f8fafc;padding:14px;border-radius:12px;border:1px solid #e2e8f0}
.fld{margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;font-weight:bold;color:#334155}
.bdg{background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:3px 8px}
.bdg span{font-weight:bold}
.bdg input{width:82px;border:none;outline:none;text-align:right;font-weight:bold;font-size:14px}
input[type=range]{width:100%}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pill{padding:7px;border:1px solid #cbd5e1;background:#fff;border-radius:7px;font-size:12px;font-weight:bold;color:#475569;cursor:pointer}
.pill.act{background:#0f172a;color:#fff;border-color:#0f172a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
@media(max-width:480px){.kpis{grid-template-columns:1fr}}
.kpi{padding:10px;border-radius:10px;border:1px solid #e2e8f0}
.kpi span{display:block;font-size:11px;font-weight:bold;color:#64748b;text-transform:uppercase}
.kpi strong{font-size:16px}
.cbox{border:1px solid #e2e8f0;border-radius:12px;padding:12px}
.leg{display:flex;gap:12px;font-size:12px;font-weight:bold;color:#475569;margin-bottom:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
canvas{width:100%;height:220px;display:block}
h3{font-size:15px;margin-bottom:8px}
.twrap{max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:right}
th{background:#f8fafc;padding:9px 10px;font-size:11px;text-transform:uppercase;color:#475569;border-bottom:1px solid #e2e8f0;position:sticky;top:0}
td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
th:first-child,td:first-child{text-align:left;font-weight:bold}
tr:nth-child(even){background:#fafbfc}
</style>
</head>
<link rel="manifest" href="./manifest.json">
<script>if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }</script>

<body>
<div class="box">
  <div class="top" id="hdr">
    <div><h1>FD Wealth Calculator</h1><p>Year-by-year returns up to 50 years</p></div>
    <div class="cur">CURRENCY<select id="cur" onchange="run()"><option value="₹">₹ INR</option><option value="$">$ USD</option><option value="€">€ EUR</option><option value="£">£ GBP</option><option value="¥">¥ JPY</option></select></div>
  </div>
  <div class="body">
    <div class="grid">
      <div class="panel">
        <div class="fld"><div class="row"><span>Deposit Amount</span><div class="bdg"><span id="sy">₹</span><input type="number" id="pN" value="100000" oninput="s('pN','pR')"></div></div><input type="range" id="pR" value="100000" min="5000" max="5000000" step="5000" oninput="s('pR','pN')"></div>
        <div class="fld"><div class="row"><span>Interest Rate</span><div class="bdg"><input type="number" id="rN" value="7.5" step="0.1" oninput="s('rN','rR')"><span id="pc">%</span></div></div><input type="range" id="rR" value="7.5" min="1" max="15" step="0.1" oninput="s('rR','rN')"></div>
        <div class="fld"><div class="row"><span>Tenure (1-50 Yrs)</span><div class="bdg"><input type="number" id="yN" value="15" min="1" max="50" oninput="s('yN','yR')"><span id="yr"> Yrs</span></div></div><input type="range" id="yR" value="15" min="1" max="50" step="1" oninput="s('yR','yN')"></div>
        <div class="fld" style="margin:0"><div class="row"><span>Compounding</span></div><div class="pills"><button type="button" class="pill" id="b12" onclick="sc(12)">Monthly</button><button type="button" class="pill act" id="b4" onclick="sc(4)">Quarterly</button><button type="button" class="pill" id="b2" onclick="sc(2)">Half-Yearly</button><button type="button" class="pill" id="b1" onclick="sc(1)">Annually</button></div></div>
      </div>
      <div>
        <div class="kpis">
          <div class="kpi"><span>Principal</span><strong id="oP">₹1,00,000</strong></div>
          <div class="kpi" id="retCard"><span>Total Returns</span><strong id="oI">₹2,04,830</strong></div>
          <div class="kpi"><span>Maturity Value</span><strong id="oM">₹3,04,830</strong></div>
        </div>
        <div class="cbox">
          <div class="leg"><span><i class="dot" style="background:#64748b"></i>Principal</span><span><i class="dot" id="legDot" style="background:#ea580c"></i>Returns</span></div>
          <canvas id="cv" width="540" height="220"></canvas>
        </div>
      </div>
    </div>
    <h3>Annual Returns Schedule</h3>
    <div class="twrap"><table><thead><tr><th>Year</th><th>Opening</th><th>Interest</th><th>Closing</th></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>
<script>
var n=4;
var themes={
  '₹':{m:'#ea580c',g:'linear-gradient(135deg,#9a3412,#ea580c)',bg:'#fff7ed',bd:'#fed7aa'},
  '$':{m:'#059669',g:'linear-gradient(135deg,#064e3b,#059669)',bg:'#ecfdf5',bd:'#a7f3d0'},
  '€':{m:'#2563eb',g:'linear-gradient(135deg,#1e3a8a,#2563eb)',bg:'#eff6ff',bd:'#bfdbfe'},
  '£':{m:'#7c3aed',g:'linear-gradient(135deg,#4c1d95,#7c3aed)',bg:'#f5f3ff',bd:'#ddd6fe'},
  '¥':{m:'#dc2626',g:'linear-gradient(135deg,#7f1d1d,#dc2626)',bg:'#fef2f2',bd:'#fecaca'}
};
function sc(v){n=v;[12,4,2,1].forEach(function(x){document.getElementById('b'+x).className='pill'});document.getElementById('b'+v).className='pill act';run()}
function s(a,b){document.getElementById(b).value=document.getElementById(a).value;run()}
function f(v){var c=document.getElementById('cur').value;return c+Math.round(v).toLocaleString(c==='₹'?'en-IN':'en-US')}
function af(v){var c=document.getElementById('cur').value;if(c==='₹'){return v>=1e7?c+(v/1e7).toFixed(1)+'Cr':v>=1e5?c+(v/1e5).toFixed(1)+'L':v>=1e3?c+Math.round(v/1e3)+'K':c+Math.round(v)}return v>=1e9?c+(v/1e9).toFixed(1)+'B':v>=1e6?c+(v/1e6).toFixed(1)+'M':v>=1e3?c+Math.round(v/1e3)+'K':c+Math.round(v)}
function run(){
  var c=document.getElementById('cur').value,th=themes[c];
  document.getElementById('hdr').style.background=th.g;
  document.getElementById('sy').innerText=c;
  ['sy','pc','yr','oI'].forEach(function(id){document.getElementById(id).style.color=th.m});
  ['pR','rR','yR'].forEach(function(id){document.getElementById(id).style.accentColor=th.m});
  var rc=document.getElementById('retCard');rc.style.background=th.bg;rc.style.borderColor=th.bd;
  document.getElementById('legDot').style.background=th.m;
  var P=+document.getElementById('pN').value||0,r=(+document.getElementById('rN').value||0)/100,Y=Math.min(50,Math.max(1,parseInt(document.getElementById('yN').value)||1));
  var h='',d=[],pv=P;
  for(var t=1;t<=Y;t++){
    var cl=P*Math.pow(1+r/n,n*t),yi=cl-pv,ti=cl-P;
    d.push({y:t,p:P,i:ti,tot:cl});
    h+='<tr><td>Year '+t+'</td><td>'+f(pv)+'</td><td style="font-weight:bold;color:'+th.m+'">+'+f(yi)+'</td><td><b>'+f(cl)+'</b></td></tr>';
    pv=cl;
  }
  var fv=P*Math.pow(1+r/n,n*Y);
  document.getElementById('oP').innerText=f(P);
  document.getElementById('oI').innerText=f(fv-P);
  document.getElementById('oM').innerText=f(fv);
  document.getElementById('tb').innerHTML=h;
  var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  var pL=60,pR=10,pT=12,pB=24,cW=W-pL-pR,cH=H-pT-pB,mx=d[d.length-1].tot||1;
  ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#64748b';ctx.font='11px Arial';ctx.textAlign='right';
  for(var g=0;g<=4;g++){var yP=pT+cH-(cH*g/4);ctx.beginPath();ctx.moveTo(pL,yP);ctx.lineTo(W-pR,yP);ctx.stroke();ctx.fillText(af(mx*g/4),pL-5,yP+4)}
  var cnt=d.length,sl=cW/cnt,bw=Math.max(2,sl*.65);ctx.textAlign='center';
  for(var i=0;i<cnt;i++){
    var it=d[i],x=pL+i*sl+(sl-bw)/2,pH=(it.p/mx)*cH,iH=(it.i/mx)*cH;
    ctx.fillStyle='#64748b';ctx.fillRect(x,pT+cH-pH,bw,pH);
    ctx.fillStyle=th.m;ctx.fillRect(x,pT+cH-pH-iH,bw,iH);
    var st=cnt<=12?1:cnt<=25?2:5;
    if(it.y===1||it.y%st===0){ctx.fillStyle='#475569';ctx.fillText('Y'+it.y,x+bw/2,H-6)}
  }
}
run();
</script>
</body>
</html>
