name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web Assets and Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon.png www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "FD Wealth Calculator" "com.fdwealth.calculator" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK and Release AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-app-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
